# Supply-chain gate. Runs in CI on every PR; run it locally with
#   cargo install cargo-deny --locked && cargo deny check
#
# The point is not purity, it is that a new transitive dependency with a bad licence, a
# known advisory or an unvetted source has to be noticed and argued for in a diff rather
# than arriving silently.

[graph]
# The targets ai-team is actually built for. Everything else - fuchsia, wasm, the BSDs -
# is dead weight in the graph and only produces findings nobody will ever act on.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# Unmaintained crates we pull in directly are our problem; deep in someone else's tree
# they usually are not actionable, so only the workspace's own choices are flagged.
unmaintained = "workspace"
# Unsound findings stay "all", unlike unmaintained: a soundness hole anywhere in the
# tree can still be reached at run time. Each one that survives has to be named below
# with a reason, so it is a decision in a diff rather than a default.
unsound = "all"
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "glib's VariantStrIter iterator impls are unsound. It arrives only through tauri -> gtk, which we do not choose and cannot patch, and ai-team never constructs a GVariant string iterator itself. Revisit when the gtk stack bumps glib; drop this entry the moment it does." },
]

[licenses]
confidence-threshold = 0.93
# The list below is a statement of what we accept, not an inventory of what we happen
# to use, so an allowed licence nothing pulls in is not worth a warning.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
exceptions = []

[bans]
# "warn", not "deny": Tauri and axum legitimately land on different minor versions of
# shared crates, and a red gate we routinely override stops being a gate.
multiple-versions = "warn"
# A `*` version requirement on a registry crate is a real hazard - it silently accepts
# a breaking release. The four workspace crates depend on each other by path and have
# no version requirement at all, which is not the same thing, so they are exempt (this
# is what `publish = false` in the workspace manifest buys).
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # D8: subscription-backed providers only. A metered HTTP client for a model API is
    # exactly the dependency that would quietly reintroduce an API-key path, so the
    # vendor SDKs are banned outright rather than merely discouraged.
    { crate = "async-openai", reason = "D8 - models are reached through eve, never a metered SDK" },
    { crate = "anthropic-sdk", reason = "D8 - the Claude subscription arrives via the bridged Claude Code CLI" },
]
skip = []
skip-tree = [
    { crate = "windows-sys", reason = "a foundational crate that bumps far too often to ever have one shared version" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
