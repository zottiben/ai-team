[package]
name = "ai-team-core"
description = "The org graph, the store and the run state behind ai-team"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rusqlite.workspace = true
rustix.workspace = true
# Loopback HTTP and process supervision. `net` and `io-util` for the eve client,
# `process` for the supervised npm/eve children, `time` for the idle timeouts.
tokio = { workspace = true, features = ["net", "io-util", "process", "time", "macros", "rt", "sync"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
