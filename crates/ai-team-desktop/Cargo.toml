[package]
name = "ai-team-desktop"
description = "ai-team as a desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ai-team"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ai-team-core = { path = "../ai-team-core" }
ai-team-ui = { path = "../ai-team-ui" }
anyhow.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tokio = { workspace = true, features = ["rt-multi-thread"] }

[features]
# Tauri's own convention: the CLI sets this so a production bundle refuses to load a dev
# server it should not be talking to.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
