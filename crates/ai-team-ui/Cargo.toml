[package]
name = "ai-team-ui"
description = "The local server and the embedded frontend bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
rmcp = { version = "2.2.0", default-features = false, features = ["server", "transport-io"] }
ai-team-core = { path = "../ai-team-core" }
axum.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["time"] }
futures-core = "0.3"

[dev-dependencies]
# Test-only: the plan-import routes are driven against a scratch planner database built
# with the engine, never the operator's own.
ai-planner-core.workspace = true
rusqlite.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros"] }

[lints]
workspace = true
