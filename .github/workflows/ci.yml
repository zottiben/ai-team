name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Keep this version in sync with rust-toolchain.toml when it is bumped. It cannot
      # be read from that file: the toolchain has to exist before cargo can parse it.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      # rust-cache keys on each crate's manifest and on Cargo.lock, but not on this
      # workspace's root manifest, where the dev profile and the workspace dependencies'
      # features live. Changing either restored a target/ built the old way, rebuilt every
      # dependency, and never saved the result - an exact key hit is not saved again. The
      # version line is left out, as rust-cache leaves out a crate's, so a release does
      # not start a cold cache.
      - name: root manifest key
        id: root-manifest
        shell: bash
        run: echo "hash=$(grep -v '^version = ' Cargo.toml | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.root-manifest.outputs.hash }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Built before the Rust gates because the bundle is compiled into the binary, and
      # a test asserts it is really there. Building it explicitly means a frontend break
      # fails here with npm's own message rather than silently embedding the committed
      # bundle and passing.
      - name: frontend - install
        run: npm ci
        working-directory: ui
      - name: frontend - typecheck
        run: npm run typecheck
        working-directory: ui
      - name: frontend - test
        run: npm test
        working-directory: ui
      - name: frontend - build
        run: npm run build
        working-directory: ui
      - name: frontend - committed bundle is current
        run: git diff --exit-code -- ui/dist

      # The worktree guard is D3's boundary and the draft-commit gate is M2-S10's; both
      # are TypeScript, so they are the pieces whose macOS behaviour the author cannot
      # check by hand (D12). Node runs .ts directly with type stripping, so this needs no
      # install - and it runs on both legs, which is the entire point.
      - name: the ai-team guard (both platforms)
        run: |
          node --test crates/ai-team-core/src/pi/assets/worktree.test.ts
          node --test crates/ai-team-core/src/pi/assets/irreversible.test.ts
          node --test crates/ai-team-core/src/pi/assets/guard.test.ts
          node --test crates/ai-team-core/src/pi/assets/lifeline.test.ts

      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

      # The desktop shell is out of default-members, so the gates above skip it. It
      # still has to compile, and on Linux that needs the webview headers.
      - name: desktop dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libgtk-3-dev libssl-dev
      - name: desktop clippy
        run: cargo clippy -p ai-team-desktop --all-targets -- -D warnings

  supply-chain:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deliberately not EmbarkStudios/cargo-deny-action: it runs in a musl container,
      # where rust-toolchain.toml resolves to a target triple the image does not have
      # and every invocation opens with a toolchain override error. A prebuilt binary on
      # the normal runner reads the same pin as every other job.
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: taiki-e/install-action@cargo-deny
      # A new transitive dependency with a bad licence, a known advisory or an unvetted
      # source has to be argued for in a diff rather than arriving silently.
      - run: cargo deny check
